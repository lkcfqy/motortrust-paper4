[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmsm-sci"
version = "0.1.0"
description = "Reproducible scientific-ML benchmarks for trustworthy PMSM digital twins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "kagglehub>=0.3.12",
  "matplotlib>=3.9",
  "mat-io>=1.0.0",
  "nptdms>=1.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
deep = [
  "torch>=2.8",
  "tensorboard>=2.18",
]
publication = [
  "pillow>=10.4",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "reportlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
